<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supply and load – interactive lesson</title>
<style>
:root{--navy:#0A2A66;--blue:#1F5FE0;--lb:#EAF2FF;--mb:#CFE0FF;--grey:#5B6F9C;--yel:#FFC400;--yelbg:#FFF6D6}
*{box-sizing:border-box}body{margin:0;background:#F7FAFF;font-family:"Liberation Sans",Arial,sans-serif;color:var(--navy)}
main{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--grey);margin:0 0 16px}
#stage{position:relative;background:#000;border-radius:14px;overflow:hidden;border:3px solid var(--mb)}
video{display:block;width:100%;height:auto;background:#000}
video::cue{background:rgba(10,42,102,.85);color:#fff}
#ov{position:absolute;inset:0;background:rgba(10,42,102,.72);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#ov.on{display:flex}
.card{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:22px 24px;border-top:8px solid var(--yel);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tag{display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:13px;border-radius:99px;padding:4px 12px;margin-bottom:10px}
.card h2{font-size:21px;line-height:1.3;margin:0 0 14px}
.ch{display:block;width:100%;text-align:left;background:var(--lb);border:2px solid var(--mb);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:17px;color:var(--navy);cursor:pointer;font-family:inherit}
.ch:hover:not([disabled]){border-color:var(--blue)}
.ch.bad{background:#fff;border-color:#E3B3B3;color:#8A93A8;text-decoration:line-through}
.ch.ok{background:var(--yelbg);border-color:var(--yel);font-weight:700}
.ch[disabled]{cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:16px;display:none}
.fb.on{display:block;background:var(--yelbg);border-left:6px solid var(--yel)}
.fb.no{background:#FFF0F0;border-left-color:#D45}
.btn{margin-top:12px;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.btn[hidden]{display:none}
#bar{position:relative;height:34px;margin-top:14px;background:var(--mb);border-radius:99px}
#fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:99px;width:0}
.dot{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:3px solid var(--yel);font-size:11px;font-weight:700;text-align:center;line-height:16px}
.dot.done{background:var(--yel)}
#status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:10px;color:var(--grey);font-size:15px}
.tools{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.tools button{background:#fff;border:2px solid var(--mb);border-radius:10px;padding:8px 14px;font-size:15px;color:var(--navy);cursor:pointer;font-family:inherit}
#end{display:none;text-align:center}
.big{font-size:56px;font-weight:700;color:var(--blue)}
</style></head><body><main>
<h1>Supply and load</h1>
<p class="sub">Congestion · Lesson 3 — answer each checkpoint question to keep watching. Use CC to pick English or 中文 subtitles.</p>
<div id="stage">
 <video id="v" controls controlsList="nofullscreen nodownload" playsinline preload="metadata">
  <source src="congestion_supply_load_lesson_narrated.mp4" type="video/mp4">
  <track kind="captions" srclang="en" label="English" src="supply_and_load.en.vtt" default>
  <track kind="captions" srclang="zh-Hans" label="中文" src="supply_and_load.zh.vtt">
 </video>
 <div id="ov"><div class="card" id="card"></div></div>
</div>
<div id="bar"><div id="fill"></div></div>
<div id="status"><span id="st1">Checkpoint 0 / 0</span><span id="st2"></span></div>
<div class="tools"><button id="fs">⛶ Fullscreen</button><button id="reset">↺ Restart course</button></div>
</main>
<script>
const FALLBACK={
  "id": "module03-congestion-supply-load",
  "title": "Supply and load check",
  "items": [
    {
      "id": "capacity-demand-q1",
      "type": "mcq",
      "prompt": "In this lesson, what is checked for every GCell (tile) to find congestion?",
      "choices": [
        "Detailed maze routing with rip-up",
        "Whether demand is larger than capacity",
        "Abacus row packing",
        "Liberty timing arcs"
      ],
      "answer": 1,
      "explain": "Each tile compares the wires wanting to pass (demand) with the wires it can hold (capacity). Maze routing, row packing and timing arcs belong to other lessons.",
      "at": 26.6
    },
    {
      "id": "capacity-demand-q2",
      "type": "mcq",
      "prompt": "In the lesson’s toy chip, how many tiles does the GCell grid have, and what is the capacity of each?",
      "choices": [
        "16×16 tiles, capacity 1.0",
        "4 columns × 3 rows = 12 tiles, capacity 2.0",
        "2×2 tiles, capacity 8.0",
        "3 rows of placement sites, capacity 0"
      ],
      "answer": 1,
      "explain": "The toy grid is 4 tiles wide and 3 tiles tall (12 GCells), each with capacity 2.0 at the start.",
      "at": 40.6
    },
    {
      "id": "capacity-demand-q3",
      "type": "mcq",
      "prompt": "How is surplus (and overflow) calculated for a GCell?",
      "choices": [
        "demand × capacity",
        "HPWL only",
        "surplus = demand − capacity; overflow when it is above 0",
        "It is always zero after legalization"
      ],
      "answer": 2,
      "explain": "surplus = demand − capacity. A positive surplus means the tile is oversubscribed; the overflow is max(0, demand − capacity).",
      "at": 56.6
    },
    {
      "id": "capacity-demand-q6",
      "type": "mcq",
      "prompt": "You lower Cap from 2.0 to 1.0 but keep the same wires and tiles. What usually happens?",
      "choices": [
        "More tiles become oversubscribed",
        "Fewer tiles become oversubscribed",
        "Nothing changes",
        "Demand automatically drops"
      ],
      "answer": 0,
      "explain": "Demand is unchanged but the budget is smaller, so borderline tiles flip to hot. Always say which Cap you used.",
      "at": 89.6
    },
    {
      "id": "capacity-demand-q5",
      "type": "mcq",
      "prompt": "With capacity 2.0, demands are 1.4, 2.0, 2.6 and 3.0. How many tiles are oversubscribed?",
      "choices": [
        "1",
        "2",
        "3",
        "4"
      ],
      "answer": 1,
      "explain": "Only 2.6 (+0.6) and 3.0 (+1.0) are above 2.0.",
      "at": 95.9
    },
    {
      "id": "capacity-demand-q4",
      "type": "mcq",
      "prompt": "Capacity is 2.0. A tile has demand 2.0. Is it oversubscribed?",
      "choices": [
        "Yes, because demand equals capacity",
        "No, it is exactly full: surplus is 0, not above 0",
        "Yes, because surplus is positive",
        "It depends on the neighbours only"
      ],
      "answer": 1,
      "explain": "Oversubscribed means surplus > 0 (strictly greater). Exactly full is still OK.",
      "at": 116.6
    },
    {
      "id": "capacity-demand-q7",
      "type": "mcq",
      "prompt": "Which is a beginner trap from the lesson?",
      "choices": [
        "Writing down the units of demand and capacity",
        "Resetting the starter placement when Cap changes",
        "Assuming a 0.0 tile is safe even when its neighbours are hot",
        "Listing oversubscribed tiles before trusting a heat map"
      ],
      "answer": 2,
      "explain": "A tile with zero demand can sit inside a hot area, so check the neighbours. The other three options are good habits.",
      "at": 130.6
    }
  ]
};
const LS='supply-load-quiz-v1';
let Q=null,state={passed:{},first:{}},v=document.getElementById('v'),ov=document.getElementById('ov'),card=document.getElementById('card'),cur=null;
function load(){try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&s.passed)state=s}catch(e){}}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
async function init(){
  try{const r=await fetch('quiz.json',{cache:'no-store'});if(!r.ok)throw 0;Q=await r.json()}catch(e){Q=FALLBACK}
  Q.items.sort((a,b)=>a.at-b.at);load();drawBar();upd();
}
const nextCP=()=>Q.items.find(i=>!state.passed[i.id]);
function drawBar(){
  const bar=document.getElementById('bar');bar.querySelectorAll('.dot').forEach(d=>d.remove());
  const D=v.duration||143.5;
  Q.items.forEach((it,k)=>{const d=document.createElement('div');d.className='dot'+(state.passed[it.id]?' done':'');d.style.left=(it.at/D*100)+'%';d.textContent=k+1;d.title='Checkpoint '+(k+1);bar.appendChild(d)});
}
function upd(){
  const n=Object.keys(state.passed).length;
  document.getElementById('st1').textContent='Checkpoint '+n+' / '+Q.items.length+' passed';
  const nx=nextCP();document.getElementById('st2').textContent=nx?'Next checkpoint at '+fmt(nx.at):'All checkpoints passed — you can scrub freely';
  document.getElementById('fill').style.width=((v.currentTime||0)/(v.duration||143.5)*100)+'%';
  document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('done',!!state.passed[Q.items[k].id]));
}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function show(it){
  cur=it;v.pause();if(document.fullscreenElement&&document.fullscreenElement!==document.getElementById('stage')){}
  const k=Q.items.indexOf(it)+1;let wrong=0;
  card.innerHTML=`<span class="tag">Checkpoint ${k} of ${Q.items.length}</span><h2></h2><div id="chs"></div><div class="fb" id="fb"></div><button class="btn" id="go" hidden>Continue video ▶</button>`;
  card.querySelector('h2').textContent=it.prompt;
  const box=card.querySelector('#chs'),fb=card.querySelector('#fb'),go=card.querySelector('#go');
  it.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='ch';b.textContent=c;
    b.onclick=()=>{
      if(i===it.answer){b.classList.add('ok');box.querySelectorAll('.ch').forEach(x=>x.disabled=true);
        fb.className='fb on';fb.textContent='✔ Correct. '+(it.explain||'');go.hidden=false;go.focus();
        if(!(it.id in state.first))state.first[it.id]=wrong===0;state.passed[it.id]=true;save();upd();
      }else{wrong++;b.classList.add('bad');b.disabled=true;fb.className='fb on no';fb.textContent='Not quite — try again. Hint: look back at the last scene.';
        if(!(it.id in state.first))state.first[it.id]=false}
    };box.appendChild(b)});
  go.onclick=()=>{ov.classList.remove('on');const t=cur.at;cur=null;if(v.currentTime<t+.05)v.currentTime=t+.05;
    if(!nextCP()&&v.currentTime>=v.duration-1){finish()}else v.play()};
  ov.classList.add('on');
}
function finish(){
  const n=Q.items.length,ok=Q.items.filter(i=>state.first[i.id]).length;
  card.innerHTML=`<div id="end" style="display:block;text-align:center"><span class="tag">Lesson complete</span><div class="big">${ok} / ${n}</div><p>answered correctly on the first try</p><p style="color:#5B6F9C">Next up: RUDY, the quick demand estimator.</p><button class="btn" id="again">Watch again</button></div>`;
  card.querySelector('#again').onclick=()=>{ov.classList.remove('on');v.currentTime=0};ov.classList.add('on');
}
/* gate: poll for the checkpoint time */
function tick(){
  if(Q&&!cur&&!v.paused&&!v.seeking){const nx=nextCP();if(nx&&v.currentTime>=nx.at)show(nx)}
  upd();requestAnimationFrame(tick)}
/* block skipping forward past an unanswered checkpoint */
v.addEventListener('seeking',()=>{if(!Q)return;const nx=nextCP();if(nx&&v.currentTime>nx.at+.3){v.currentTime=nx.at-.05;v.pause();setTimeout(()=>show(nx),50)}});
v.addEventListener('ended',()=>{if(!nextCP())finish()});
v.addEventListener('loadedmetadata',()=>{if(Q)drawBar()});
document.getElementById('fs').onclick=()=>{const s=document.getElementById('stage');document.fullscreenElement?document.exitFullscreen():s.requestFullscreen&&s.requestFullscreen()};
document.getElementById('reset').onclick=()=>{state={passed:{},first:{}};save();v.currentTime=0;ov.classList.remove('on');cur=null;upd()};
init().then(()=>requestAnimationFrame(tick));
</script></body></html>
